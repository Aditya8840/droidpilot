[project]
name = "droidpilot"
version = "0.1.0"
description = "AI agent that operates your Android phone via ADB accessibility tree"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "lxml>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
all = ["anthropic>=0.30"]

[project.scripts]
droidpilot = "droidpilot.main:main"
